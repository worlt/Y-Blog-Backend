server:
  port: ${server.port}
spring:
  application:
    name: Blog
  profiles:
    active: dev
  datasource:
    driver-class-name: ${blog.datasource.driver-class-name}
    url: ${blog.datasource.url}
    username: ${blog.datasource.username}
    password: ${blog.datasource.password}
  data:
    redis:
      host: ${blog.redis.host}
      port: ${blog.redis.port}
      database: ${blog.redis.database}
      # 设置连接超时时间
      timeout: ${blog.redis.timeout}
      # Redis连接失败时不会立即抛出异常
      lettuce:
        shutdown-timeout: ${blog.redis.lettuce.shutdown-timeout}
  # 邮箱
  mail:
    host: ${spring.mail.host}
    port: ${spring.mail.port}
    username: ${spring.mail.username}
    password: ${spring.mail.password}
    protocol: ${spring.mail.protocol}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true
  task:
    scheduling:
      pool:
        size: 5
  servlet:
    multipart:
      max-file-size: 2MB

blog:
  wechat:
    appid: ${blog.wechat.appid}
    secret: ${blog.wechat.secret}

  # bitiful config
  bitiful:
    endpoint: ${blog.bitiful.endpoint}
    region: ${blog.bitiful.region}
    access-key: ${blog.bitiful.access-key}
    secret-key: ${blog.bitiful.secret-key}
    bucket-name: ${blog.bitiful.bucket-name}
    domain-url: ${blog.bitiful.domain-url}

  jwt:
    # 设置jwt签名加密时使用的密钥
    admin-secret-key: ${blog.jwt.admin-secret-key}
    # 设置jwt过期时间
    admin-ttl: ${blog.jwt.admin-ttl}
    # 设置前端传过来的令牌名称
    admin-token-name: ${blog.jwt.admin-token-name}
    # 设置jwt签名加密时使用的密钥
    auditor-secret-key: ${blog.jwt.auditor-secret-key}
    # 设置jwt过期时间
    auditor-ttl: ${blog.jwt.auditor-ttl}
    # 设置前端传过来的令牌名称
    auditor-token-name: ${blog.jwt.auditor-token-name}
    # 设置jwt签名加密时使用的密钥
    user-secret-key: ${blog.jwt.user-secret-key}
    # 设置jwt过期时间
    user-ttl: ${blog.jwt.user-ttl}
    # 设置前端传过来的令牌名称
    user-token-name: ${blog.jwt.user-token-name}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.blog.entity
  configuration:
    # 开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      blog:
        mapper: debug
        service: info
        controller: info

# 硅基流动 AI 配置
siliconflow:
  api-key: ${siliconflow.api-key}
  base-url: https://api.siliconflow.cn/v1
#  model: THUDM/GLM-4-9B-0414 #无思考
  model: THUDM/GLM-4.1V-9B-Thinking #有思考